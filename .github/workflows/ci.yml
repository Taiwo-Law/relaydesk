name: RelayDesk CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v

      - name: Build Docker image
        run: docker build -t relaydesk:ci .

      - name: Start Docker container
        run: docker run -d --name relaydesk-ci -p 5000:5000 relaydesk:ci

      - name: Smoke test container
        run: curl --fail --retry 10 --retry-delay 1 --retry-all-errors http://127.0.0.1:5000/health

      - name: Show container diagnostics
        if: always()
        run: |
          docker ps -a
          docker logs relaydesk-ci || true

      - name: Stop Docker container
        if: always()
        run: docker rm -f relaydesk-ci || true

