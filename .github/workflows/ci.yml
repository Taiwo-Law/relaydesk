name: RelayDesk CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: taiwo-law/relaydesk

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v

      - name: Build Docker image
        run: docker build -t relaydesk:ci .

      - name: Start Docker container
        run: docker run -d --name relaydesk-ci -p 5000:5000 relaydesk:ci

      - name: Smoke test container
        run: curl --fail --retry 10 --retry-delay 1 --retry-all-errors http://127.0.0.1:5000/health

      - name: Show container diagnostics
        if: always()
        run: |
          docker ps -a
          docker logs relaydesk-ci || true

      - name: Stop Docker container
        if: always()
        run: docker rm -f relaydesk-ci || true

      - name: Publish Docker image
        if: github.event_name == 'push' && success()
        run: |
          docker tag relaydesk:ci ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker tag relaydesk:ci ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

