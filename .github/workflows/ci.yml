name: RelayDesk CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: taiwo-law/relaydesk

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect application changes
        id: app_changes
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet "${{ github.event.before }}" "${{ github.sha }}" -- \
            app.py \
            Dockerfile \
            requirements.txt \
            .dockerignore; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && steps.app_changes.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.5"

      - name: Check Terraform formatting
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        working-directory: terraform
        run: terraform init -backend=false

      - name: Validate Terraform
        working-directory: terraform
        run: terraform validate

      - name: Scan Terraform security with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: 'v0.75.0'
          scan-type: 'config'
          scan-ref: './terraform'
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'

      - name: Build Docker image
        if: github.event_name == 'pull_request' || steps.app_changes.outputs.changed == 'true'
        run: docker build -t relaydesk:ci .

      - name: Scan Docker image with Trivy
        if: github.event_name == 'pull_request' || steps.app_changes.outputs.changed == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: 'v0.75.0'
          image-ref: 'relaydesk:ci'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'

      - name: Start Docker container
        if: github.event_name == 'pull_request' || steps.app_changes.outputs.changed == 'true'
        run: docker run -d --name relaydesk-ci -p 5000:5000 relaydesk:ci

      - name: Smoke test container
        if: github.event_name == 'pull_request' || steps.app_changes.outputs.changed == 'true'
        run: curl --fail --retry 10 --retry-delay 1 --retry-all-errors http://127.0.0.1:5000/health

      - name: Show container diagnostics
        if: always() && (github.event_name == 'pull_request' || steps.app_changes.outputs.changed == 'true')
        run: |
          docker ps -a
          docker logs relaydesk-ci || true

      - name: Stop Docker container
        if: always() && (github.event_name == 'pull_request' || steps.app_changes.outputs.changed == 'true')
        run: docker rm -f relaydesk-ci || true

      - name: Publish Docker image
        if: github.event_name == 'push' && steps.app_changes.outputs.changed == 'true' && success()
        run: |
          docker tag relaydesk:ci ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker tag relaydesk:ci ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Configure AWS credentials
        if: github.event_name == 'push' && steps.app_changes.outputs.changed == 'true' && success()
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::203918848327:role/relaydesk-github-actions-role
          aws-region: ca-central-1

      - name: Deploy RelayDesk to ECS
        if: github.event_name == 'push' && steps.app_changes.outputs.changed == 'true' && success()
        run: |
          aws ecs update-service \
            --cluster relaydesk-cluster \
            --service relaydesk-service \
            --force-new-deployment \
            --region ca-central-1

      - name: Wait for ECS service stability
        if: github.event_name == 'push' && steps.app_changes.outputs.changed == 'true' && success()
        run: |
          aws ecs wait services-stable \
            --cluster relaydesk-cluster \
            --services relaydesk-service \
            --region ca-central-1

      - name: Verify deployed RelayDesk health
        if: github.event_name == 'push' && steps.app_changes.outputs.changed == 'true' && success()
        timeout-minutes: 3
        shell: bash
        run: |
          TASK_ARN=$(aws ecs list-tasks \
            --cluster relaydesk-cluster \
            --service-name relaydesk-service \
            --desired-status RUNNING \
            --region ca-central-1 \
            --query 'taskArns[0]' \
            --output text)

          ENI_ID=$(aws ecs describe-tasks \
            --cluster relaydesk-cluster \
            --tasks "$TASK_ARN" \
            --region ca-central-1 \
            --query "tasks[0].attachments[0].details[?name=='networkInterfaceId'].value | [0]" \
            --output text)

          PUBLIC_IP=$(aws ec2 describe-network-interfaces \
            --network-interface-ids "$ENI_ID" \
            --region ca-central-1 \
            --query 'NetworkInterfaces[0].Association.PublicIp' \
            --output text)

          echo "Testing RelayDesk at http://${PUBLIC_IP}:5000/health"

          curl --fail \
            --connect-timeout 5 \
            --max-time 10 \
            --retry 10 \
            --retry-delay 2 \
            --retry-all-errors \
            "http://${PUBLIC_IP}:5000/health"
